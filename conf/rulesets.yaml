# Rule set registry.
#
# Pre-registration matters: baseline-v1 must be frozen (`frozen_at` set) BEFORE
# any variant result is inspected, otherwise the round-2 "improvement" claim is
# just overfitting to the test set.

rulesets:
  baseline-v1:
    description: >
      Round-1 rule set. Sigma rules in conf/rules/baseline plus the authored
      Python rules in identity_shield.detect.python_rules. Frozen before the
      first variant is evaluated against the round-2 rule set.
    sigma_dirs:
      - conf/rules/baseline
    include_python_rules: true
    source: mixed
    frozen_at: "2026-11-19T00:00:00Z"
    manifest_sha256: "b20e7084fbf6ad51f691ef8beabdf29e1b31e3b51c0613659ce7f8932bc4e311"
    git_sha: "9b103b1cd162cf031fdd3ca0abe7aa54ee828607"

  improved-v1:
    description: >
      Round-2 rule set, authored after analysing misses on the training split.
      Must generalise on field sets rather than specific values. The naive
      round-1 Python rules are deliberately excluded: keeping them would make
      every improvement score a mixture of both rounds.
    sigma_dirs:
      - conf/rules/improved
    include_python_rules: false
    source: sigma
    frozen_at: "2026-11-20T00:00:00Z"
    manifest_sha256: "fb6d78778541f4de7c59f9749617c1b0154d0f47e5cf367c2de18496625fa547"
    git_sha: "9b103b1cd162cf031fdd3ca0abe7aa54ee828607"

# Optional: vendored community corpus, used only for the compile-rate report.
# Pull with scripts/pull_sigma.ps1. Not part of any rule set by default.
community:
  root: vendor/sigma/rules/cloud/aws
  purpose: compile-rate measurement only
