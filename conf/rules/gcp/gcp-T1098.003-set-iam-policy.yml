title: GCP IAM Policy Modified (SetIamPolicy)
id: c7a1d802-3b2a-4c9e-8d10-1a2b3c4d0002
status: test
description: Detects IAM policy modifications across GCP projects, folders, or service accounts.
references:
  - https://attack.mitre.org/techniques/T1098/003/
author: Identity Shield
date: 2026/11/27
tags:
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    protoPayload.methodName|endswith: SetIamPolicy
  condition: selection and not filter_denied
  filter_denied:
    protoPayload.status.code: 7
falsepositives:
  - Terraform IAM bindings rollout
level: high
