title: GCP Secret Manager Access
id: c7a1d804-3b2a-4c9e-8d10-1a2b3c4d0004
status: test
description: Detects retrieval or listing of GCP Secret Manager secrets.
references:
  - https://attack.mitre.org/techniques/T1555/006/
author: Identity Shield
date: 2026/11/27
tags:
  - attack.credential-access
  - attack.t1555.006
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    protoPayload.serviceName: secretmanager.googleapis.com
    protoPayload.methodName|contains:
      - AccessSecretVersion
      - ListSecrets
  condition: selection and not filter_denied
  filter_denied:
    protoPayload.status.code: 7
falsepositives:
  - Runtime workload secret fetch
level: high
