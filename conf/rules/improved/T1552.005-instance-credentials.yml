title: AWS Instance Role Used Outside Instance SDKs
id: 8a1c4e10-2d3f-4b5a-9c6d-1e2f3a4b5c07
status: test
description: >-
  Round-2 rule. Motivation: the round-1 rule required GetCallerIdentity and an
  aws-cli user agent, so a stolen session used through another client vanished.
  This rule keys on the EC2 role identity and excludes the SDK user agents that
  the instance itself uses. It is still a behavioural proxy: AWS logs no IMDS
  event, so a boto3-based theft remains a known miss.
references:
  - https://attack.mitre.org/techniques/T1552/005/
author: Identity Shield
date: 2026/11/19
tags:
  - attack.credential-access
  - attack.t1552.005
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_role:
    userIdentity.arn|contains: ':assumed-role/is-ec2-role/'
  filter_instance_sdk:
    userAgent|contains:
      - Boto3
      - aws-sdk
  condition: selection_role and not filter_instance_sdk
fields:
  - userIdentity.arn
  - sourceIPAddress
  - userAgent
falsepositives:
  - Break-glass debugging from an instance
level: high
