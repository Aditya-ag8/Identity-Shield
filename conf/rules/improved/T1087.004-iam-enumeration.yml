title: AWS IAM Enumeration - field-set generalisation
id: 8a1c4e10-2d3f-4b5a-9c6d-1e2f3a4b5c01
status: test
description: >-
  Round-2 rule. Motivation: the round-1 rule covered only ListUsers and
  ListRoles, so a variant that used ListAccessKeys or
  GetAccountAuthorizationDetails produced no alert. This rule keys on the
  IAM enumeration field set instead of two literal event names.
references:
  - https://attack.mitre.org/techniques/T1087/004/
author: Identity Shield
date: 2026/11/19
tags:
  - attack.discovery
  - attack.t1087.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName:
      - ListUsers
      - ListRoles
      - ListAccessKeys
      - GetAccountAuthorizationDetails
      - ListAttachedRolePolicies
      - ListRolePolicies
  condition: selection and not filter_errors
  filter_errors:
    errorCode: AccessDenied
fields:
  - eventName
  - userIdentity.arn
falsepositives:
  - Authorised inventory tooling
level: medium
