title: AWS Additional Credentials - field-set generalisation
id: 8a1c4e10-2d3f-4b5a-9c6d-1e2f3a4b5c04
status: test
description: >-
  Round-2 rule. Motivation: the round-1 rule detected CreateAccessKey only. A
  variant that created a login profile or rotated an existing one produced no
  alert. This rule covers the credential-creation field set.
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: Identity Shield
date: 2026/11/19
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName:
      - CreateAccessKey
      - CreateLoginProfile
      - UpdateLoginProfile
      - CreateServiceSpecificCredential
      - ResetServiceSpecificCredential
  condition: selection and not filter_errors
  filter_errors:
    errorCode: AccessDenied
fields:
  - eventName
  - userIdentity.arn
  - requestParameters.userName
falsepositives:
  - CI/CD key rotation
  - Helpdesk password reset
level: high
