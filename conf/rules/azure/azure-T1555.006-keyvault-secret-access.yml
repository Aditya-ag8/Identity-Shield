title: Azure Key Vault Secret Retrieval or Enumeration
id: d8b2e903-4c3b-4d0f-9e20-2b3c4d5e0003
status: test
description: Detects Azure Key Vault secret read or listing operations.
references:
  - https://attack.mitre.org/techniques/T1555/006/
author: Identity Shield
date: 2026/11/27
tags:
  - attack.credential-access
  - attack.t1555.006
logsource:
  product: azure
  service: activitylogs
detection:
  selection_op:
    operationName.value:
      - SecretGet
      - SecretList
      - Microsoft.KeyVault/vaults/secrets/read
  selection_norm:
    eventName:
      - SecretGet
      - SecretList
  condition: selection_op or selection_norm
falsepositives:
  - Authorized app config startup
level: high
