title: Microsoft Entra Service Principal or Application Credential Added
id: d8b2e902-4c3b-4d0f-9e20-2b3c4d5e0002
status: test
description: Detects addition of certificates or client secrets to an Entra service principal or application.
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: Identity Shield
date: 2026/11/27
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    activityDisplayName|contains:
      - Add service principal credentials
      - Certificates and secrets management
  condition: selection
falsepositives:
  - Scheduled secret rotation
level: high
