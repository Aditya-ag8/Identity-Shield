title: AWS Console Login Without MFA
id: 5f0b7a1e-1c2d-4a3b-9e8f-0a1b2c3d4e04
status: test
description: >
  Detects a successful console sign-in where MFA was not used. CloudTrail
  records this in additionalEventData.MFAUsed.
references:
  - https://attack.mitre.org/techniques/T1078/004/
author: Identity Shield
date: 2026/11/03
tags:
  - attack.initial-access
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: signin.amazonaws.com
    eventName: ConsoleLogin
    responseElements.ConsoleLogin: Success
    additionalEventData.MFAUsed: 'No'
  condition: selection
fields:
  - userIdentity.arn
  - sourceIPAddress
  - additionalEventData.MFAUsed
falsepositives:
  - Legacy accounts that have not enrolled MFA
level: high
