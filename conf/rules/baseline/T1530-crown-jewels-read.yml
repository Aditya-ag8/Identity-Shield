title: AWS Crown Jewels Bucket Read
id: 5f0b7a1e-1c2d-4a3b-9e8f-0a1b2c3d4e08
status: test
description: >
  Detects s3:GetObject against the designated sensitive bucket. Round-1 rule:
  hardcodes one bucket name and one API, so both a different bucket and a
  different read API fall outside it.
references:
  - https://attack.mitre.org/techniques/T1530/
author: Identity Shield
date: 2026/11/03
tags:
  - attack.collection
  - attack.t1530
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: s3.amazonaws.com
    eventName: GetObject
    requestParameters.bucketName: is-lab-crown-jewels
  condition: selection
fields:
  - userIdentity.arn
  - requestParameters.bucketName
  - requestParameters.key
  - sourceIPAddress
falsepositives:
  - The data platform's own service account
level: high
