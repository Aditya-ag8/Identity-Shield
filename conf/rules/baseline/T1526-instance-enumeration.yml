title: AWS EC2 Instance Enumeration
id: 5f0b7a1e-1c2d-4a3b-9e8f-0a1b2c3d4e02
status: test
description: >
  Detects ec2:DescribeInstances. Round-1 rule: single API name, no attempt to
  cover the rest of a service sweep.
references:
  - https://attack.mitre.org/techniques/T1526/
author: Identity Shield
date: 2026/11/03
tags:
  - attack.discovery
  - attack.t1526
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: ec2.amazonaws.com
    eventName: DescribeInstances
  condition: selection
fields:
  - eventName
  - userAgent
falsepositives:
  - Terraform plan
  - Auto Scaling health checks
level: low
