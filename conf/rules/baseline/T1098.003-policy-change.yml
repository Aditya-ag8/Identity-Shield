title: AWS IAM Role Policy Modified
id: 5f0b7a1e-1c2d-4a3b-9e8f-0a1b2c3d4e06
status: test
description: >
  Detects inline and managed policy attachment on roles. Round-1 rule: covers
  AttachRolePolicy and PutRolePolicy, not trust-policy edits or PassRole.
references:
  - https://attack.mitre.org/techniques/T1098/003/
author: Identity Shield
date: 2026/11/03
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName:
      - AttachRolePolicy
      - PutRolePolicy
  condition: selection
fields:
  - userIdentity.arn
  - requestParameters.roleName
  - requestParameters.policyArn
falsepositives:
  - Infrastructure as code applying a known policy set
level: high
