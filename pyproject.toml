[project]
name = "identity-shield"
version = "0.1.0"
description = "Detection-robustness testing harness for AWS CloudTrail rules"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pysigma>=0.11",
    "pyyaml>=6.0",
    "allpairspy>=2.5",
    "pandas>=2.0",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "scipy>=1.11"]

[project.scripts]
identity-shield = "identity_shield.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
